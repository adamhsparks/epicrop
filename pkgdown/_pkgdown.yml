template:
  bootstrap: 5
  params:
    bootswatch: lux
  math-rendering: mathjax
  includes:
    in_header: |
      <style>
        body { padding-top: 80px; }
        html { scroll-padding-top: 90px; }
      </style>
url: https://adamhsparks.codeberg.page/epicrop/
reference:
  - title: Helper Functions for Rice Disease Simulations
    desc: |
      Run `seir()` using pre-defined models
    contents:
      - bacterial_blight
      - brown_spot
      - leaf_blast
      - sheath_blight
      - tungro
      - modified_kim_leaf_blast
      - modified_kim_sheath_blight
      - leaf_rust
      - s_tritici_blotch
  - title: Helper Functions for Multiple Simulations
    contents:
      - run_epicrop_model
      - build_epicrop_emergence
      - audpc_dt
  - title: SEIR
    desc: |
      A susceptible-exposed-infectious-removed (SEIR) model and the main function that drives {epicrop}
    contents: seir
  - title: Weather Data
    desc: |
      Functions for fetching and formatting weather data for use in {epicrop}
    contents:
      - get_wth
      - fetch_epicrop_weather_list
      - format_wth
  - title: Miscellaneous
    desc: |
      Other functions
    contents:
      - get_audpc
